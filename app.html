<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Art Chain - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-auth.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-storage.js";

    // Same config as index.html
    const firebaseConfig = { /* YOUR CONFIG HERE */ };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const storage = getStorage(app);

    const WORKER_URL = "https://your-worker.your-subdomain.workers.dev/thought";
    let currentUser = null;

    onAuthStateChanged(auth, (user) => {
      if (!user) window.location.href = "index.html";
      currentUser = user;
    });

    window.logout = () => signOut(auth);

    window.recordThought = async () => {
      const text = document.getElementById('thought-text').value;
      const fileInput = document.getElementById('thought-image');
      const button = document.getElementById('submit-btn');
      
      if (!text && fileInput.files.length === 0) return alert("Add text or an image.");
      
      button.disabled = true;
      button.innerText = "Recording...";

      try {
        let imageCID = ""; // We'll use the URL as the identifier for now
        
        // 1. Upload image if exists
        if (fileInput.files.length > 0) {
          const file = fileInput.files[0];
          const storageRef = ref(storage, `thoughts/${currentUser.uid}/${Date.now()}_${file.name}`);
          await uploadBytes(storageRef, file);
          imageCID = await getDownloadURL(storageRef);
        }

        // 2. Get auth token to secure the Worker endpoint
        const idToken = await currentUser.getIdToken();

        // 3. Send to Cloudflare Worker
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${idToken}`
          },
          body: JSON.stringify({
            projectId: "default_project", // Hardcoded for this prototype
            text: text,
            imageCID: imageCID
          })
        });

        if (!response.ok) throw new Error("Worker failed to record thought");

        alert("Thought immutably recorded!");
        document.getElementById('thought-text').value = '';
        fileInput.value = '';
      } catch (error) {
        alert("Error: " + error.message);
      } finally {
        button.disabled = false;
        button.innerText = "Record Thought";
      }
    };
  </script>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">
  <!-- Header -->
  <header class="bg-white px-4 py-4 shadow-sm flex justify-between items-center sticky top-0">
    <h1 class="text-xl font-bold text-gray-800">My Project</h1>
    <button onclick="logout()" class="text-sm text-gray-500 font-medium">Log out</button>
  </header>

  <!-- Main Content -->
  <main class="flex-1 p-4 w-full max-w-lg mx-auto space-y-6">
    <!-- Input Card -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
      <textarea id="thought-text" rows="3" placeholder="What did you work on today?" class="w-full bg-transparent resize-none outline-none text-gray-800 placeholder-gray-400"></textarea>
      
      <div class="flex items-center justify-between mt-4 border-t pt-3 border-gray-100">
        <label class="cursor-pointer text-gray-500 hover:text-black transition-colors flex items-center gap-2">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
          <span class="text-sm font-medium">Attach Image</span>
          <input type="file" id="thought-image" accept="image/*" class="hidden">
        </label>
        
        <button id="submit-btn" onclick="recordThought()" class="bg-black text-white px-5 py-2 rounded-full font-semibold text-sm active:scale-95 transition-transform">
          Record
        </button>
      </div>
    </div>
  </main>
</body>
</html>
